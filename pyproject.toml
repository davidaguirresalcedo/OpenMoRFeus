[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openmorfeus"
version = "0.3.3"
description = "Open-source Python driver, CLI, PyQt6 GUI, and sweep controller for the Outernet moRFeus"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "hidapi>=0.14",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.5"]

[project.scripts]
openmorfeus = "openmorfeus.cli:main"
openmorfeus-gui = "openmorfeus.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
