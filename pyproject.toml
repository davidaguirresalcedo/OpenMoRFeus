[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmorfeus"
version = "0.1.0"
description = "Open-source Python driver and CLI for the Outernet moRFeus"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hidapi>=0.14",
]

[project.scripts]
openmorfeus = "openmorfeus.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
